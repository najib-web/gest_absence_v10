<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne — Gestion des Absences</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ecfdf5, #ffffff 55%, #f0fdfa);
      color: #111827;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #d1fae5;
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 12px 40px rgba(5, 150, 105, 0.12);
    }
    .icon {
      width: 72px; height: 72px; border-radius: 18px;
      background: linear-gradient(135deg, #10b981, #0f766e);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 34px; color: #fff;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; line-height: 1.6; margin-bottom: 6px; }
    .ar { direction: rtl; }
    button {
      margin-top: 22px; padding: 12px 28px; border: 0; border-radius: 12px;
      background: #059669; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📶</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion internet puis réessayez.<br>Les données se rechargeront automatiquement.</p>
    <p class="ar" lang="ar"><strong>أنت غير متصل</strong></p>
    <p class="ar" lang="ar">تحقق من اتصالك بالإنترنت ثم أعد المحاولة.</p>
    <button onclick="location.reload()">Réessayer / إعادة المحاولة</button>
  </main>
</body>
</html>
